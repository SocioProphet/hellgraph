# Coordinator: a Service (stable DNS the workers dial) + a Job (partitions, ships shards, runs BSP,
# prints the verified result, exits). The Service selects the coordinator pod by label.
apiVersion: v1
kind: Service
metadata:
  name: hg-coordinator
  labels: { app: hg-bench, role: coordinator }
spec:
  clusterIP: None            # headless: workers resolve the pod directly, no proxy hop
  selector: { app: hg-bench, role: coordinator }
  ports:
    - name: bsp
      port: 9000
      targetPort: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hg-coordinator
  labels: { app: hg-bench, role: coordinator }
spec:
  backoffLimit: 0            # a benchmark run is not idempotent; do not silently retry
  activeDeadlineSeconds: 3600   # fail LOUD after an hour, never hang the cluster (and its bill) forever
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: hg-bench, role: coordinator }
    spec:
      restartPolicy: Never
      tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      # NOTE: the distributed-generation design (workers make their own shards) keeps the coordinator
      # LIGHTWEIGHT — it never holds the whole graph. If you fall back to the centralized design for a big
      # single run, add a big-RAM coordinator node pool + `nodeSelector: {cloud.google.com/gke-nodepool: coord}`
      # + a matching toleration, and bump requests/limits accordingly.
      containers:
        - name: coordinator
          image: IMAGE_PLACEHOLDER          # set by run.sh (registry/hellgraph-bench:tag)
          imagePullPolicy: Always           # always pull the pushed tag; never a stale cached image
          env:
            - { name: HG_ROLE, value: coordinator }
            - { name: HG_LISTEN, value: "0.0.0.0:9000" }
          envFrom:
            - configMapRef: { name: hg-bench-params }
          ports:
            - containerPort: 9000
          resources:
            requests: { cpu: "2", memory: "4Gi" }   # lightweight orchestrator (distributed design)
            limits:   { cpu: "4", memory: "12Gi" }
