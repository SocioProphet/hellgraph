# Workers: an Indexed Job. completions == parallelism == HG_SHARDS, so every shard runs at once and each
# pod gets a unique JOB_COMPLETION_INDEX (0..N-1) — the worker reads that as its shard ordinal.
#
# ROBUSTNESS (learned the hard way):
#  • requests are SMALL and honest — workers hold one shard (~a few GB even at 1B/k). Requesting more than
#    a node can give (after GKE system daemonsets eat ~2-3Gi) is what left a worker unschedulable and hung
#    the whole run. Request little, let the limit allow bursting.
#  • podAntiAffinity spreads workers one-per-node (best for the halo network, and avoids packing surprises).
#  • activeDeadlineSeconds fails the run LOUDLY instead of hanging forever if something is wrong.
#  • completions/parallelism MUST equal HG_SHARDS; run.sh patches both from the ConfigMap so they never drift.
apiVersion: batch/v1
kind: Job
metadata:
  name: hg-workers
  labels: { app: hg-bench, role: worker }
spec:
  completionMode: Indexed
  completions: 8            # == HG_SHARDS (run.sh keeps these in sync)
  parallelism: 8            # == HG_SHARDS
  backoffLimit: 0
  activeDeadlineSeconds: 3600   # fail loud, don't hang the cluster indefinitely
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: hg-bench, role: worker }
    spec:
      restartPolicy: Never
      tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      # Spread workers one per node — better halo network, and no accidental packing.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { role: worker }
      containers:
        - name: worker
          image: IMAGE_PLACEHOLDER          # set by run.sh
          imagePullPolicy: Always           # always pull the pushed tag; never a stale cached image
          # Runtime from HG_RUNTIME: dist_p2p (billion) or dist_gen (100B–1T no-cap). Both mesh peer-to-peer;
          # HG_ADVERTISE=podIP (below) lets the mesh form across pods. HG_ACCEL=5 = Anderson (~2× fewer steps).
          command: ["/bin/sh", "-c", "exec /usr/local/bin/${HG_RUNTIME:-dist_p2p}"]
          env:
            - { name: HG_ROLE, value: worker }
            - { name: HG_COORD, value: "hg-coordinator:9000" }
            - { name: HG_ADVERTISE, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            # JOB_COMPLETION_INDEX is injected by k8s for Indexed jobs; the worker reads it as ordinal.
          envFrom:
            - configMapRef: { name: hg-bench-params }
          resources:
            # HONEST sizing: a worker holds one shard's CSR + rank vectors. Request small so it ALWAYS
            # schedules (this is what bit us); the limit lets it burst for the biggest shards.
            requests: { cpu: "1", memory: "2Gi" }
            limits:   { cpu: "4", memory: "12Gi" }
