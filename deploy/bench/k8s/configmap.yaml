# Shared benchmark parameters — the coordinator and the workers MUST agree on HG_SHARDS.
# HG_SCALE 30 = 2^30 ≈ 1.07B vertices; edgefactor 16 ⇒ ~17B edges. Dial down for a smaller first run
# (scale 26 ≈ 67M vertices / ~1B edges is the MVP proof). Change here, re-apply, re-run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hg-bench-params
  labels: { app: hg-bench }
data:
  HG_SHARDS: "8"
  # NOTE: the coordinator MATERIALIZES the whole graph in RAM before sharding, so single-run scale is
  # capped by the COORDINATOR node's memory, not the aggregate cluster. On 16 GB nodes, scale 23 (~134M
  # edges, ~9 GB peak on the coordinator) is the safe ceiling. Hitting 1B needs a big coordinator node
  # (e.g. t2a-standard-32) or streaming generation — tracked as follow-up.
  HG_SCALE: "26"        # 2^26 ≈ 67M vertices → ~1.07B edges (the billion, on the big-RAM coordinator)
  HG_EDGEFACTOR: "16"
  HG_ITERS: "25"
  # FAST PATH (dist_p2p): the coordinator is out of the recurring hot path (O(k) scalar all-reduce only),
  # so the relay that made the first billion 404s is gone. Recurring halo is peer-to-peer.
  # HG_DELTA_EPS (optional): set e.g. "1e-9" to also send only ghosts that MOVED > eps → ~1.5-5× less wire,
  # for a bounded O(eps) perturbation. LEAVE UNSET for a bit-exact verified run (eps=0 is exact but doesn't
  # save wire — f64 ranks keep wiggling; the saving needs eps>0). Measured local proof: `cargo run --example
  # dist_p2p` with/without HG_DELTA_EPS.
  # HG_DELTA_EPS: "1e-9"
  # HG_RUNTIME: which distributed runtime the pods exec.
  #   dist_p2p (default) = billion fast path: coordinator-free P2P halo; coordinator materializes the graph
  #                        once (needs a big-RAM coordinator node), then O(k) recurring.
  #   dist_gen           = 100B–1T NO-CAP path: distributed generation + all-to-all shuffle → NO node ever
  #                        holds O(m) OR O(n); coordinator is O(k). Verified bit-exact; use for 100B+.
  # HG_RUNTIME: "dist_gen"
  # HG_ACCEL: "5"   # Anderson acceleration window — ~2× fewer supersteps (both runtimes). Unset = power iteration.
  # HG_VERIFY: "0"  # REQUIRED for large dist_gen runs: verify=on makes the coordinator regenerate the whole
  #                 # graph + hold O(n) to cross-check (fine at small scale, defeats the no-cap at 100B). At
  #                 # billion+ set 0 → coordinator holds O(k) and checks Σrank≈1 (mass conservation) instead.
