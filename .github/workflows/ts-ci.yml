name: ts-ci

# TypeScript engine lane (independent of the Rust crate CI). Builds the package
# and fails if the committed ts/dist has drifted from ts/src — since consumers
# install the prebuilt dist via git dependency, the build must always be current.
#
# `build-and-verify-dist` is a REQUIRED status check on `main`. A required check
# that is path-filtered never reports on PRs that don't touch those paths, which
# leaves the required context stuck "expected" and blocks the PR forever (a
# Rust-only PR could only merge via an admin bypass). To avoid that trap the job
# runs on ALL pull requests and reports its context, but the expensive npm build
# only runs when TS/dist-relevant files actually changed — the dist-drift
# guarantee is unchanged, it just no longer blocks unrelated PRs.
on:
  push:
    paths:
      - "package.json"
      - "ts/**"
      - "ontology/**"
      - "scripts/**"
      - ".github/workflows/ts-ci.yml"
  pull_request: {}

# Both jobs only read the checkout and install from the public registry. Declared at workflow
# level so a job added later inherits least-privilege instead of silently getting the default
# write-scoped token (CodeQL actions/missing-workflow-permissions — which was already open
# against this file on `main` for build-and-verify-dist, not just the new job below).
permissions:
  contents: read

jobs:
  build-and-verify-dist:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect TS/dist-relevant changes
        id: changed
        env:
          # Single source of truth for "this change can affect ts/dist". Must stay a superset of
          # the `on.push.paths` list above — the step below asserts exactly that, because the two
          # drifting apart is what this comment block keeps recording.
          TS_PATHS: '^(package(-lock)?\.json|ts/|ontology/|scripts/|\.github/workflows/ts-ci\.yml)'
        run: |
          # The PR detector must not be NARROWER than the workflow's own push filter. It was:
          # push declared ontology/** and scripts/** relevant, the detector did not, and the
          # derivation is real —
          #   ontology/kko/kko-2.10.n3        -> scripts/gen-kko.mjs             -> ts/src/kko-data.ts
          #   ontology/effect-request/*.json  -> scripts/gen-effect-request.mjs  -> ts/src/*
          #   ontology/semantic-action/*.json -> scripts/gen-semantic-action.mjs -> ts/src/semantic-action-data.ts
          #                                                                      -> ts/dist
          # so a re-vendor touching only ontology/ took the "trivially satisfied" branch and
          # build-and-verify-dist — a REQUIRED check on main — went green having built nothing.
          # The kko-provenance job below covers the FIRST of those three chains, but it is not a
          # required check, and nothing covers the other two.
          #
          # Derive the push filter from this file rather than restating it, so widening one and
          # forgetting the other fails here instead of silently skipping a build.
          python3 - <<'PY'
          import os, re, sys, pathlib
          wf = pathlib.Path('.github/workflows/ts-ci.yml').read_text().split('\n')
          start = next(i for i, l in enumerate(wf) if l.startswith('  push:'))
          end = next(i for i, l in enumerate(wf[start + 1:], start + 1) if re.match(r'^  \S', l))
          declared = re.findall(r'^\s*-\s*"([^"]+)"', '\n'.join(wf[start:end]), re.M)
          if not declared:
              sys.exit('::error::could not read on.push.paths from ts-ci.yml — this guard has gone blind')
          rx = re.compile(os.environ['TS_PATHS'])
          # One representative path per declared family; a glob stands for a file beneath it.
          bad = [p for p in declared if not rx.match(p.replace('**', 'x').replace('*', 'x'))]
          if bad:
              sys.exit(f'::error::on.push.paths declares {bad} relevant, but the PR change-detector '
                       f'regex does not match them. A PR touching only those paths would report '
                       f'build-and-verify-dist green without building anything.')
          print(f'detector covers all {len(declared)} declared push paths: {declared}')
          PY
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push is already path-filtered to TS-relevant paths — always build.
            echo "ts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Must include package-lock.json and THIS WORKFLOW, not just package.json and ts/**:
          #   - a dependency bump can land entirely in the lockfile, and that is exactly the
          #     change most likely to break the suite;
          #   - a PR editing only ts-ci.yml previously skipped every step, so the workflow that
          #     defines this gate was the one change the gate never ran on. This PR is that
          #     shape: before this line was widened, the commit adding the Test step below had
          #     it reported as `skipped`.
          if git diff --name-only "$base" "$head" | grep -qE "$TS_PATHS"; then
            echo "ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "ts=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.ts == 'true'
        with:
          node-version: 20

      - name: Install
        if: steps.changed.outputs.ts == 'true'
        run: npm install --no-audit --no-fund

      - name: Typecheck
        if: steps.changed.outputs.ts == 'true'
        run: npm run typecheck

      # The TypeScript suite was never executed by ANY workflow: ci.yml runs
      # `cargo test --workspace` (Rust only) and this job ran typecheck + build + a dist
      # staleness check. 401 tests existed and nothing invoked them, so a TS regression
      # could merge with every required check green — typecheck proves it COMPILES, not
      # that it WORKS. Runs before the dist rebuild so a logic failure is reported as a
      # test failure rather than surfacing later as a confusing dist diff.
      - name: Test
        if: steps.changed.outputs.ts == 'true'
        run: npm test

      - name: Rebuild dist
        if: steps.changed.outputs.ts == 'true'
        run: npm run build

      - name: Fail if committed ts/dist is stale
        if: steps.changed.outputs.ts == 'true'
        run: |
          if ! git diff --quiet -- ts/dist; then
            echo "::error::ts/dist is out of date with ts/src. Run 'npm run build' and commit ts/dist."
            git diff --stat -- ts/dist
            exit 1
          fi
          echo "ts/dist is in sync with source."

      - name: No TS/dist changes — required check trivially satisfied
        if: steps.changed.outputs.ts != 'true'
        run: echo "This PR touches no package.json, package-lock.json, ts/**, ontology/**, scripts/** or ts-ci.yml files; build-and-verify-dist has nothing to verify."

  # ── Vendored-ontology provenance (W12) ─────────────────────────────────────────────
  # ontology/kko/PROVENANCE.md recorded a sha256 that NOTHING verified. Consumers across the
  # estate (prophet-platform apps/owl-reasoner) pin the same digest and assert it at import, so
  # the engine — the artifact's source of truth — was the one copy where drift went unnoticed.
  # Runs on every PR (cheap, no path filter) so a re-vendor can never land unverified.
  kko-provenance:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify vendored KKO provenance + generated kko-data.ts
        run: npm run check:kko

  # ── Constitutional conformance (ADR-0004, the Crown) ────────────────────────────────
  # Seats the Telos Layer over the Truth Engine: Keter (welfare-annealing objective, NOT
  # control-max), Da'at (policy weights/thresholds, CANNOT assert truth), Truth Engine
  # (falsifiable + witnessed + multi-valued/temporal/adversary-aware). The checker fires the
  # cross-layer invariants that no single discourse.ts function sees — esp. "Da'at cannot assert
  # truth" (D1) and "a control-telos is unconstitutional" (K1). Deterministic + stdlib only (no
  # deps, no install, no path filter) so the boundary can never regress unverified.
  constitution:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify constitutional invariants (ADR-0004 teeth)
        run: npm run check:constitution
