name: ts-ci

# TypeScript engine lane (independent of the Rust crate CI). Builds the package
# and fails if the committed ts/dist has drifted from ts/src — since consumers
# install the prebuilt dist via git dependency, the build must always be current.
#
# `build-and-verify-dist` is a REQUIRED status check on `main`. A required check
# that is path-filtered never reports on PRs that don't touch those paths, which
# leaves the required context stuck "expected" and blocks the PR forever (a
# Rust-only PR could only merge via an admin bypass). To avoid that trap the job
# runs on ALL pull requests and reports its context, but the expensive npm build
# only runs when TS/dist-relevant files actually changed — the dist-drift
# guarantee is unchanged, it just no longer blocks unrelated PRs.
on:
  push:
    paths:
      - "package.json"
      - "ts/**"
      - "ontology/**"
      - "scripts/**"
      - ".github/workflows/ts-ci.yml"
  pull_request: {}

# Both jobs only read the checkout and install from the public registry. Declared at workflow
# level so a job added later inherits least-privilege instead of silently getting the default
# write-scoped token (CodeQL actions/missing-workflow-permissions — which was already open
# against this file on `main` for build-and-verify-dist, not just the new job below).
permissions:
  contents: read

jobs:
  build-and-verify-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect TS/dist-relevant changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push is already path-filtered to TS-relevant paths — always build.
            echo "ts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Must include package-lock.json and THIS WORKFLOW, not just package.json and ts/**:
          #   - a dependency bump can land entirely in the lockfile, and that is exactly the
          #     change most likely to break the suite;
          #   - a PR editing only ts-ci.yml previously skipped every step, so the workflow that
          #     defines this gate was the one change the gate never ran on. This PR is that
          #     shape: before this line was widened, the commit adding the Test step below had
          #     it reported as `skipped`.
          if git diff --name-only "$base" "$head" \
             | grep -qE '^(package(-lock)?\.json|ts/|\.github/workflows/ts-ci\.yml)'; then
            echo "ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "ts=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.ts == 'true'
        with:
          node-version: 20

      - name: Install
        if: steps.changed.outputs.ts == 'true'
        run: npm install --no-audit --no-fund

      - name: Typecheck
        if: steps.changed.outputs.ts == 'true'
        run: npm run typecheck

      # The TypeScript suite was never executed by ANY workflow: ci.yml runs
      # `cargo test --workspace` (Rust only) and this job ran typecheck + build + a dist
      # staleness check. 401 tests existed and nothing invoked them, so a TS regression
      # could merge with every required check green — typecheck proves it COMPILES, not
      # that it WORKS. Runs before the dist rebuild so a logic failure is reported as a
      # test failure rather than surfacing later as a confusing dist diff.
      - name: Test
        if: steps.changed.outputs.ts == 'true'
        run: npm test

      - name: Rebuild dist
        if: steps.changed.outputs.ts == 'true'
        run: npm run build

      - name: Fail if committed ts/dist is stale
        if: steps.changed.outputs.ts == 'true'
        run: |
          if ! git diff --quiet -- ts/dist; then
            echo "::error::ts/dist is out of date with ts/src. Run 'npm run build' and commit ts/dist."
            git diff --stat -- ts/dist
            exit 1
          fi
          echo "ts/dist is in sync with source."

      - name: No TS/dist changes — required check trivially satisfied
        if: steps.changed.outputs.ts != 'true'
        run: echo "This PR touches no package.json, package-lock.json, ts/** or ts-ci.yml files; build-and-verify-dist has nothing to verify."

  # ── Vendored-ontology provenance (W12) ─────────────────────────────────────────────
  # ontology/kko/PROVENANCE.md recorded a sha256 that NOTHING verified. Consumers across the
  # estate (prophet-platform apps/owl-reasoner) pin the same digest and assert it at import, so
  # the engine — the artifact's source of truth — was the one copy where drift went unnoticed.
  # Runs on every PR (cheap, no path filter) so a re-vendor can never land unverified.
  kko-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify vendored KKO provenance + generated kko-data.ts
        run: npm run check:kko
